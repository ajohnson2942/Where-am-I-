<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where Am I? Door Sign</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #172033;
      background: #eef2f7;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .sign {
      width: min(92vw, 720px);
      padding: 56px;
      border: 8px solid #172033;
      border-radius: 30px;
      background: #fff;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 11vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
    }
    p {
      margin: 24px 0 28px;
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 700;
    }
    img {
      width: min(100%, 390px);
      height: auto;
    }
    .url {
      margin: 20px 0 0;
      font-size: 0.95rem;
      font-weight: 650;
      word-break: break-all;
    }
    @media print {
      @page { size: letter; margin: 0.35in; }
      body { background: #fff; }
      .sign {
        width: 100%;
        min-height: 9.9in;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="sign">
    <h1>WHERE<br>AM I?</h1>
    <p>Scan to see my current status.</p>
    <img src="./qr-code.svg" alt="QR code for the Where Am I status page">
    <div class="url">ajohnson2942.github.io/where-am-I-/</div>
  </main>
</body>
</html>
