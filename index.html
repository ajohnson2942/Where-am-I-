<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2457e6">
  <meta name="description" content="Current location, room activity, and availability status.">
  <title>Where Am I?</title>
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <main class="page-shell">
    <header class="page-header"><h1>Where Am I?</h1></header>
    <section id="statusCard" class="card" aria-live="polite"><div class="loading">Loading current status…</div></section>
  </main>
  <script>
    (() => {
      "use strict";
      const owner = "ajohnson2942";
      const repo = "Where-am-I-";
      const branch = "main";
      const statusPath = "status.json";
      const card = document.getElementById("statusCard");
      const locations = { campus: "On Campus", offCampus: "Off Campus", room: "In My Room" };
      const activities = { sleeping: "Sleeping", working: "Homework / Club Stuff / Something Important", chilling: "Chilling" };

      function decodeBase64Utf8(value) {
        const binary = atob(value.replace(/\n/g, ""));
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      async function fetchFromGitHubApi() {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${statusPath}?ref=${branch}&t=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store", headers: { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } });
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        const file = await response.json();
        return JSON.parse(decodeBase64Utf8(file.content));
      }

      async function fetchFromRawFile() {
        const response = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${statusPath}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Status file returned ${response.status}`);
        return response.json();
      }

      function renderStatus(status) {
        const location = locations[status.location] || locations.room;
        const inRoom = status.location === "room";
        const activity = activities[status.activity] || activities.chilling;
        const dnd = Boolean(status.doNotDisturb);
        const showTalkingStatus = Boolean(status.showTalkingStatus);
        const feelsLikeTalking = Boolean(status.feelsLikeTalking);

        card.innerHTML = `
          <div class="status-section">
            <p class="status-label">Location</p>
            <p class="status-value"><span>${location}</span></p>
          </div>
          ${inRoom ? `
            <div class="status-section">
              <p class="status-label">If in room, I am currently</p>
              <p class="status-value ${status.activity === "working" ? "long" : ""}"><span>${activity}</span></p>
            </div>
            <div class="status-section">
              <p class="status-label">Do Not Disturb?</p>
              <span class="dnd-pill ${dnd ? "yes" : "no"}">${dnd ? "🔴 Yes" : "🟢 No"}</span>
            </div>
            ${showTalkingStatus ? `
              <div class="status-section">
                <p class="status-label">Do I feel like talking right now?</p>
                <p class="status-value"><span>${feelsLikeTalking ? "Yes" : "No"}</span></p>
              </div>
            ` : ""}
          ` : ""}
        `;
      }

      async function loadStatus() {
        try {
          let status;
          try { status = await fetchFromGitHubApi(); }
          catch { status = await fetchFromRawFile(); }
          renderStatus(status);
        } catch (error) {
          console.error(error);
          card.innerHTML = '<div class="error-message">The current status could not be loaded. Refresh the page and try again.</div>';
        }
      }

      loadStatus();
      window.setInterval(loadStatus, 120000);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadStatus(); });
    })();
  </script>
</body>
</html>
